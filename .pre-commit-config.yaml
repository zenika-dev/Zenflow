repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv --project backend run ruff format --
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff-check
        entry: uv --project backend run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true
